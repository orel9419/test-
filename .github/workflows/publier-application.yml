# Publie l'application (version installable) sur GitHub Pages, branche gh-pages,
# à chaque mise à jour du jeu. Activation unique dans le dépôt :
# Settings > Pages > Build and deployment > Source : « Deploy from a branch », branche gh-pages, dossier / (root).
#
# Sécurité de la chaîne de publication :
# - les actions tierces sont épinglées sur une empreinte de commit (un tag peut être déplacé) ;
# - la construction n'a qu'un droit de lecture ; seule l'étape de publication peut écrire,
#   et uniquement la branche gh-pages ;
# - les dépendances sont installées depuis le fichier de verrouillage (npm ci) et auditées.
name: Publier l'application

on:
  push:
    branches: [claude/chef-de-gouvernement, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publier-application
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit des dépendances embarquées dans le jeu
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application
          path: dist
          include-hidden-files: true
          retention-days: 1

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application
          path: dist
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publication de l'application"
