# Publie l'application (version installable) sur GitHub Pages, branche gh-pages,
# à chaque mise à jour du jeu. Activation unique dans le dépôt :
# Settings > Pages > Build and deployment > Source : « Deploy from a branch », branche gh-pages, dossier / (root).
#
# Sécurité de la chaîne de publication :
# - les actions tierces sont épinglées sur une empreinte de commit (un tag peut être déplacé) ;
# - la construction n'a qu'un droit de lecture ; seule l'étape de publication peut écrire,
#   et uniquement la branche gh-pages ;
# - les dépendances sont installées depuis le fichier de verrouillage (npm ci) et auditées.
name: Publier l'application

on:
  push:
    branches: [claude/chef-de-gouvernement, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publier-application
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit des dépendances embarquées dans le jeu
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application
          path: dist
          include-hidden-files: true
          retention-days: 1

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: application
          path: dist
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publication de l'application"
